name: Note APK

# Gera o APK do Note a cada mudança na ilha (note/) ou no app (note-android/)
# e publica em Releases › "Note para Android", com o arquivo Note.apk.
on:
  push:
    paths:
      - 'note/**'
      - 'note-android/**'
      - '.github/workflows/note-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        working-directory: note-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Note.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Note-apk
          path: Note.apk

      - name: Publicar link de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=note-apk
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES="APK do Note gerado a partir do commit ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}). Baixe Note.apk no celular e instale. Na primeira vez o Android pede para permitir instalar apps desta fonte."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Note para Android" --notes "$NOTES" --prerelease
            gh release upload "$TAG" Note.apk --clobber
          else
            gh release create "$TAG" Note.apk --title "Note para Android" --notes "$NOTES" --prerelease
          fi
